name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js as static export
        run: npm run build

      - name: Copy build to docs folder
        run: |
          mkdir -p docs
          cp -r out/* docs/
          echo '<!-- Do not edit this file, it is auto-generated -->' > docs/.nojekyll

      - name: Commit and push to docs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: update docs folder with build output"
          git push origin main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}